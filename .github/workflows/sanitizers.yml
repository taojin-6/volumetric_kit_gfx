name: sanitizers

# AddressSanitizer + UndefinedBehaviorSanitizer + LeakSanitizer, Linux-only
# (LeakSanitizer isn't available on macOS). Builds against lavapipe (software
# Vulkan) with validation layers on, so the GPU-touching tests run under the
# sanitizers — this is what catches the leak / use-after-free / double-free
# class the unit tests alone can't detect. It stays on a GitHub-hosted runner
# with lavapipe rather than the self-hosted GPU runners: under ASan/LSan,
# NVIDIA's proprietary driver reports its own allocations as leaks. Invoked by
# ci.yml, which owns the push / pull_request triggers and the concurrency group.
on:
  workflow_call:

jobs:
  asan-ubsan-lsan:
    # Skipped for a fork's pull request, as is every job ci.yml reaches.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # a sanitized build is ~2-4x the plain build
    env:
      # Absolute path: ctest changes cwd per test, so a relative suppressions
      # path would silently fail to load. print_suppressions=1 prints a match
      # count per entry at exit, so an over-broad rule (one quietly absorbing
      # first-party leaks) shows up in the log instead of staying invisible.
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan.supp:print_suppressions=1
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang \
            libvulkan-dev vulkan-validationlayers spirv-tools glslang-tools \
            libglfw3-dev libglm-dev \
            vulkan-tools
          # lavapipe (software Vulkan) is what lets the GPU-touching tests run on
          # this GPU-less runner. Install it WITHOUT --no-install-recommends: the
          # driver's runtime deps (LLVM, etc.) otherwise get stripped and it loads
          # as ERROR_INCOMPATIBLE_DRIVER, which silently skips the GPU tests —
          # exactly the failure this job exists to prevent.
          sudo apt-get install -y mesa-vulkan-drivers
          # Discover the ICD instead of hardcoding a path that moves between mesa
          # versions, and pin the loader to it.
          icd=""; for f in /usr/share/vulkan/icd.d/lvp_icd*.json; do [ -e "$f" ] && { icd="$f"; break; }; done
          [ -n "$icd" ] || { echo "::error::lavapipe ICD not found after install"; exit 1; }
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      # lavapipe is REQUIRED here: the whole point of this job is to run the
      # GPU-touching code under ASan/UBSan/LSan. If no device comes up we FAIL
      # loudly — a green run that silently skipped those tests (per AGENTS.md,
      # the leak / use-after-free / double-free class) is worse than a red one.
      - name: Require a Vulkan device (lavapipe)
        run: |
          echo "--- ICD ($VK_ICD_FILENAMES) ---"; cat "$VK_ICD_FILENAMES"
          echo "--- lavapipe .so deps ---"
          if ldd /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so* 2>&1 | grep -i 'not found'; then
            echo "::error::lavapipe shared object has missing libraries (see above)"; exit 1
          fi
          echo "--- vulkaninfo (loader debug on) ---"
          if ! VK_LOADER_DEBUG=error,warn vulkaninfo --summary; then
            echo "::error::lavapipe produced no Vulkan device — the GPU-touching tests would skip under the sanitizers"
            exit 1
          fi

      # Cache the FetchContent dependency tree (sources and builds), as
      # _build.yml does, so it is not re-fetched and recompiled every run. Here
      # the dependencies are compiled with the sanitizers too (VG_SANITIZE sets
      # its flags globally), so besides the pins the key carries everything that
      # changes their objects: the compiler, the runner image, this workflow (the
      # sanitizer and build settings below) and vg_sanitizers.cmake. The
      # workspace path is in it as in _build.yml, since FetchContent bakes it in.
      # No restore-keys, for the reason _build.yml gives: a stale match would
      # link objects built for something else.
      - name: Dependency cache key
        id: deps
        run: |
          hash() { sha256sum | cut -c1-12; }
          ws=$(printf '%s' "${GITHUB_WORKSPACE}" | hash)
          cc=$(clang --version | head -1 | hash)
          echo "key=sanitizers-deps-ws${ws}-cc${cc}-img${ImageVersion:-none}" >> "${GITHUB_OUTPUT}"

      - name: Cache third-party deps
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ steps.deps.outputs.key }}-${{ hashFiles('third_party/CMakeLists.txt', 'cmake/vg_sanitizers.cmake', '.github/workflows/sanitizers.yml') }}

      # Debug + clang gives the most reliable sanitizer + mesa interop. No
      # examples: this job never runs them. VG_TEST_SHARDS: each test binary
      # runs as 4 one-process shards (tests/CMakeLists.txt), so its tests share
      # Vulkan devices and the sanitizer runtime starts 36 times, not 385.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DVG_SANITIZE="address;undefined" \
            -DVG_BUILD_EXAMPLES=OFF \
            -DVG_TEST_SHARDS=4

      - name: Build
        run: cmake --build build --parallel

      # If a future mesa bump produces leak noise tools/lsan.supp doesn't cover,
      # the escape hatch is to split this run: CPU-only tests with full leak
      # detection, driver-backed tests with ASAN_OPTIONS=detect_leaks=0 (ASan +
      # UBSan still on). Prefer extending the suppressions first.
      #
      # --parallel: a hosted runner sets no CTEST_PARALLEL_LEVEL, so ctest would
      # otherwise run the suite one test at a time. A leak or sanitizer finding
      # fails its shard, and the report's stack traces name the code.
      - name: Test
        env:
          # As in _build.yml: shuffled order, a fixture test without a Vulkan
          # device fails rather than skips, since a shard has no skip
          # expression to report it by, and the validation layer checks the
          # handles and lifetimes ASan cannot see.
          GTEST_SHUFFLE: '1'
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          VKC_TEST_VALIDATION: '1'
        run: ctest --test-dir build --output-on-failure --parallel "$(nproc)"
