name: build (reusable)

# Reusable build & test for one OS leg. ci.yml calls this once per entry in its
# build matrix. A leg can run on a GitHub-hosted runner (pass just `os`) or on a
# self-hosted runner in an OS-matched container with a GPU passed through (pass
# `runner` + `container`) — the dependency-install steps key off `runner.os`
# (Linux/macOS), so the same steps serve hosted and containerised legs alike.
on:
  workflow_call:
    inputs:
      os:
        description: Leg identity, used in the job name and cache key (e.g. ubuntu-24.04).
        required: true
        type: string
      runner:
        description: >-
          runs-on label. Empty → use `os` as a GitHub-hosted image; set to a
          self-hosted label (e.g. vk-linux-gpu) to move this leg onto your box.
        required: false
        type: string
        default: ''
      container:
        description: >-
          JSON for the job container, e.g.
          '{"image":"ubuntu:24.04","options":"--gpus all"}', or '' for none.
          Lets one self-hosted host build several Ubuntu userlands with the GPU
          passed through.
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.os }}
    # Render the container JSON to a map only when one was requested; macOS and
    # any hosted leg pass '' and run directly on the runner. `&&` short-circuits,
    # so fromJSON is never handed the empty string.
    container: ${{ inputs.container != '' && fromJSON(inputs.container) || null }}
    timeout-minutes: 30
    defaults:
      run:
        # Inside a container GitHub runs `run:` steps under `sh` (dash), not the
        # `bash` it defaults to on hosted runners. Dash only learned `set -o
        # pipefail` in 0.5.12 (POSIX 2024) — Ubuntu 26.04 has it, 22.04/24.04 do
        # not — so force bash everywhere for one consistent shell across legs.
        shell: bash
    env:
      # 'true' when this leg runs in a container. In this repo containers are
      # used only on the self-hosted GPU box (the Ubuntu legs), where the image
      # is a bare ubuntu:* (no toolchain) and the real 5090 is passed through;
      # this drives the toolchain install and the ICD choice below.
      IN_CONTAINER: ${{ inputs.container != '' }}
    strategy:
      fail-fast: false
      # Build + test both an unoptimized Debug and an optimized Release/NDEBUG
      # configuration, so an NDEBUG-only or optimizer-exposed break is caught.
      matrix:
        build_type: [Debug, Release]
    steps:
      # Bare ubuntu:* images lack git (actions/checkout needs it) and sudo (the
      # install steps use it); we run as root in the container, so install them
      # before anything else. Skipped on hosted runners.
      - name: Bootstrap container
        if: inputs.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git sudo

      - uses: actions/checkout@v7

      # Every build/test step below is gated on this, so a false here means the
      # job compiles nothing, runs no tests, and still reports success — which
      # `ci / required` would then treat as a passing build. There is no state
      # of this repo in which a missing top-level CMakeLists.txt is acceptable
      # (a rename, a moved workdir, or a path-filtered checkout would all
      # produce one), so fail loudly instead of annotating and skipping.
      - name: Detect build system
        id: detect
        run: |
          if [ ! -f CMakeLists.txt ]; then
            echo "::error::No top-level CMakeLists.txt in $(pwd) — refusing to report success for a job that would build and test nothing."
            ls -la
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (Linux)
        if: steps.detect.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          # vulkan-tools provides vulkaninfo; the rest is the build + validation
          # toolchain. A C/C++ toolchain + make ship preinstalled on the hosted
          # images but NOT in a bare ubuntu:* container, so add build-essential there.
          pkgs="cmake libvulkan-dev vulkan-validationlayers spirv-tools glslang-tools libglfw3-dev libglm-dev xvfb vulkan-tools"
          if [ "$IN_CONTAINER" = "true" ]; then
            pkgs="$pkgs build-essential"
          else
            # GPU-less hosted runner: lavapipe (software Vulkan) gives the
            # GPU-dependent tests a device to run against.
            pkgs="$pkgs mesa-vulkan-drivers"
          fi
          # shellcheck disable=SC2086  # intentional: split $pkgs into separate args
          sudo apt-get install -y --no-install-recommends $pkgs
          # On a hosted runner, point the loader at lavapipe for the rest of the
          # job. On the GPU box we pin nothing: the NVIDIA Vulkan ICD injected by
          # the container toolkit (--gpus all + NVIDIA_DRIVER_CAPABILITIES=all) is
          # then the only ICD, so the GPU-dependent tests run on the real 5090 —
          # and if it is absent, vulkaninfo finds no device and the GPU steps skip
          # themselves rather than fail.
          # TODO: bake these deps into a prebuilt image to drop ~30-60s/run.
          if [ "$IN_CONTAINER" != "true" ]; then
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies (macOS)
        if: steps.detect.outputs.present == 'true' && runner.os == 'macOS'
        env:
          # The formulae we need are bottled, so skip the slow, network-heavy
          # auto-update — its `git fetch` is the step that flakes on transient
          # runner DNS ("Could not resolve host: github.com").
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          # Retry to ride out transient Homebrew fetch/DNS blips on the runner.
          ok=0
          for attempt in 1 2 3; do
            # spirv-tools provides spirv-val: vg_compile_shaders runs it only
            # when present, so without it this leg compiles SPIR-V it never
            # validates and the check exists on Linux alone.
            if brew install cmake molten-vk glfw glm \
                vulkan-headers vulkan-loader vulkan-tools shaderc spirv-cross \
                spirv-tools; then
              ok=1
              break
            fi
            echo "::warning::brew install attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          [ "${ok}" = 1 ] || {
            echo "::error::brew install failed after 3 attempts"
            exit 1
          }
          # make ships with the Xcode command-line tools.

      # Report the Vulkan device the runner sees (the real GPU in a self-hosted
      # container, lavapipe on a hosted Linux runner, MoltenVK on macOS).
      # Non-fatal: GPU-dependent tests skip themselves when no device exists.
      - name: GPU diagnostic
        if: steps.detect.outputs.present == 'true'
        run: vulkaninfo --summary || echo "::notice::no Vulkan device visible — GPU tests will skip"

      # The dependency cache is keyed by the workspace *path*, so compute a short
      # fingerprint of it. See the cache step below for why the path is the thing
      # that has to match.
      - name: Workspace fingerprint
        id: ws
        if: steps.detect.outputs.present == 'true'
        run: |
          h=$(printf '%s' "${GITHUB_WORKSPACE}" |
              { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-12)
          echo "hash=${h}" >> "${GITHUB_OUTPUT}"
          echo "workspace ${GITHUB_WORKSPACE} -> ${h}"

      # Cache the FetchContent dependency tree (VMA / spirv-cross / googletest
      # sources + builds) so they are not re-cloned and recompiled every run.
      # FetchContent bakes the absolute build path into its sub-build CMakeCache,
      # so a cache is only reusable where that path is identical -- restore one
      # built elsewhere and Configure dies with "CMakeCache.txt directory ... is
      # different than the directory ... where CMakeCache.txt was created".
      #
      # The key therefore carries a hash of GITHUB_WORKSPACE: the path itself,
      # not a proxy for it. This previously keyed on `runner.name` for native
      # runners, on the assumption that a given runner's path is stable -- but
      # relocating a self-hosted runner on disk (…/actions-runner-N ->
      # …/ci-runners/<repo>/runner-N) changes the path while keeping the name, so
      # the key still matched and every macOS leg restored a cache full of dead
      # absolute paths and failed to configure. Hashing the workspace makes a
      # relocation a natural cache miss instead. It also subsumes the `ctr`
      # special case: containerised legs all see the same /__w/… path, so they
      # hash alike and share one key exactly as before.
      - name: Cache third-party deps
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ inputs.os }}-${{ matrix.build_type }}-ws${{ steps.ws.outputs.hash }}-${{ hashFiles('third_party/CMakeLists.txt') }}
          # No restore-keys: a prefix fallback drops the third_party/CMakeLists.txt
          # hash, so flipping a dependency's version or build options would restore
          # and relink the archives built from the *previous* pin — a stale-object
          # failure that looks like a source bug. A pin change should be a clean
          # cache miss (a full dependency rebuild) rather than a silent reuse.

      # A self-hosted runner keeps its _work tree between jobs, so a build/ left
      # by a previous checkout survives a runner relocation with the old absolute
      # paths still baked into every CMakeCache.txt. The key change above stops
      # the *cache* carrying stale paths in, but cannot clean what is already on
      # disk -- and the Configure retry loop cannot help either, since the failure
      # is deterministic and simply fails three times.
      #
      # So: if any CMakeCache.txt under build/ records a directory other than the
      # one it now occupies, the tree is unusable. Drop it and let Configure start
      # clean. Hosted runners always start empty and no-op here.
      - name: Discard a build tree left behind at a different path
        if: steps.detect.outputs.present == 'true'
        run: |
          [ -d build ] || exit 0
          stale=$(find build -name CMakeCache.txt -exec sh -c '
            recorded=$(sed -n "s/^CMAKE_CACHEFILE_DIR:INTERNAL=//p" "$1" | head -1)
            actual=$(cd "$(dirname "$1")" && pwd)
            if [ -n "${recorded}" ] && [ "${recorded}" != "${actual}" ]; then
              echo "$1 records ${recorded}, now at ${actual}"
            fi
          ' _ {} \; | head -3)
          if [ -n "${stale}" ]; then
            echo "::warning::discarding a stale build tree:"
            echo "${stale}"
            rm -rf build
          fi

      # Default ("Unix Makefiles") generator + a parallel make build, per
      # project preference — no Ninja.
      - name: Configure
        if: steps.detect.outputs.present == 'true'
        # Retry to ride out transient FetchContent git-clone DNS blips, matching
        # the package-install retry above.
        run: |
          ok=0
          for attempt in 1 2 3; do
            if cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}; then
              ok=1
              break
            fi
            echo "::warning::cmake configure attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          [ "${ok}" = 1 ] || {
            echo "::error::cmake configure failed after 3 attempts"
            exit 1
          }

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: cmake --build build --parallel

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: ctest --test-dir build --output-on-failure

      # Nothing above compiles the *installed* tree, so an install-list mistake
      # -- shipping a header whose own #include was excluded -- reaches
      # consumers with CI green. Two cheap checks close that:
      #   1. include closure: every "volumetric_kit/..." include in an installed
      #      header must itself be installed. This is what catches an EXCLUDE
      #      that orphans a dependent header.
      #   2. a real downstream build: find_package the installed package and
      #      compile every public header (impl/ headers are documented as
      #      "included from" their parent, never standalone, so they are not
      #      included directly here -- check 1 is what covers them).
      - name: Install and consume the installed package
        if: steps.detect.outputs.present == 'true'
        run: |
          set -euo pipefail
          prefix="${{ runner.temp }}/vg_install"
          consumer="${{ runner.temp }}/vg_consumer"
          rm -rf "$prefix" "$consumer"
          cmake --install build --prefix "$prefix"

          python3 - "$prefix/include" <<'EOF'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          pat = re.compile(r'^\s*#\s*include\s*"(volumetric_kit/[^"]+)"', re.M)
          headers = sorted(root.rglob("*.hpp"))
          missing = [(str(h.relative_to(root)), inc)
                     for h in headers
                     for inc in pat.findall(h.read_text())
                     if not (root / inc).exists()]
          for h, inc in missing:
              print(f"::error::installed header {h} includes {inc}, which is NOT installed")
          print(f"include closure: {len(headers)} headers, {len(missing)} broken include(s)")
          sys.exit(1 if missing else 0)
          EOF

          mkdir -p "$consumer"
          cat > "$consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(vg_consumer CXX)
          find_package(volumetric_kit_gfx CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE volumetric_kit::gfx)
          EOF
          python3 - "$prefix/include" "$consumer/main.cpp" <<'EOF'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          hdrs = sorted(str(p.relative_to(root)) for p in root.rglob("*.hpp")
                        if "/impl/" not in str(p))
          pathlib.Path(sys.argv[2]).write_text(
              "".join(f'#include "{h}"\n' for h in hdrs) + "int main() { return 0; }\n")
          print(f"consumer includes {len(hdrs)} public headers")
          EOF
          cmake -S "$consumer" -B "$consumer/build" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build "$consumer/build" --parallel

      # gfx must stay generatable with -G Xcode -- that is the generator an iOS
      # or macOS app bundle consumes. What regresses is the *generate*, not the
      # build (e.g. a custom command reachable from two targets with no edge
      # between them, which Xcode rejects outright), so generating is the whole
      # check and no xcodebuild is needed. The Makefile legs above cannot see
      # it. Xcode is multi-config, so one generate covers both build types --
      # run it on the Debug leg only.
      - name: Xcode generate check (macOS)
        if: >-
          steps.detect.outputs.present == 'true' && runner.os == 'macOS'
          && matrix.build_type == 'Debug'
        run: |
          shopt -s nullglob

          # -G Xcode drives xcodebuild, which ships with full Xcode only -- the
          # command line tools do not include it. Resolve a developer directory
          # that has one: prefer whatever is active, but fall back to a
          # discovered Xcode.app, since xcode-select can point at the command
          # line tools on a machine that does have Xcode and re-pointing it is
          # global and needs sudo. DEVELOPER_DIR is per-process, so this needs
          # no privileges and changes nothing outside the step -- and dropping
          # the inherited value first keeps the result independent of what the
          # runner's launchd session happened to export.
          unset DEVELOPER_DIR
          DEVELOPER_DIR=$(xcode-select -p 2>/dev/null) || DEVELOPER_DIR=
          if [ ! -x "${DEVELOPER_DIR}/usr/bin/xcodebuild" ]; then
            for app in /Applications/Xcode*.app; do
              if [ -x "${app}/Contents/Developer/usr/bin/xcodebuild" ]; then
                DEVELOPER_DIR="${app}/Contents/Developer"
                break
              fi
            done
          fi
          export DEVELOPER_DIR

          # Probe xcodebuild rather than trusting the path: a missing Xcode, an
          # unaccepted license and a pending first launch all fail here, and all
          # three otherwise reach CMake as nothing more than "The CXX compiler
          # identification is unknown".
          if ! probe=$(xcodebuild -version 2>&1); then
            echo "::error::-G Xcode needs a working full Xcode. Developer directory resolved to '${DEVELOPER_DIR:-none}'; xcodebuild said: ${probe}"
            echo "On the runner: install Xcode, then sudo xcodebuild -license accept && sudo xcodebuild -runFirstLaunch"
            exit 1
          fi
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          echo "${probe}"

          # Reuse the sources FetchContent already populated for `build`, so
          # this costs one configure rather than a re-clone. Derived from the
          # directory names instead of a hardcoded dep list, so adding a
          # third_party dep needs no edit here; if the deps are missing the
          # array is empty and FetchContent just fetches. A separate -B dir
          # keeps `build/` -- and the deps cache uploaded from it -- untouched.
          flags=()
          for src in build/_deps/*-src; do
            dep=$(basename "${src}" -src | tr '[:lower:]' '[:upper:]')
            flags+=("-DFETCHCONTENT_SOURCE_DIR_${dep}=${PWD}/${src}")
          done
          rm -rf build-xcode
          cmake -S . -B build-xcode -G Xcode "${flags[@]}"

      # Runtime-validate the windowing tier through the real window -> surface ->
      # swapchain -> present path. lavapipe has no VK_EXT_headless_surface (so the
      # headless windowing test skips), but it supports the X11 WSI, so drive the
      # windowed example through a virtual X server with validation layers on.
      # macOS runners are display-less, so the example is build-only there (it is
      # runtime-validated locally on MoltenVK). On the self-hosted GPU box this
      # runs against the real 5090, still under Xvfb since the example opens a
      # GLFW/X11 window.
      # TODO: validate NVIDIA + Xvfb presentation on the box; if flaky, drive the
      # example through VK_EXT_headless_surface (which the NVIDIA ICD supports).
      - name: Run windowed examples (Linux, Xvfb)
        if: steps.detect.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          set -o pipefail
          # Skip (don't fail) when no Vulkan device is present, matching how the
          # GPU-dependent ctest cases skip themselves — e.g. a runner where
          # lavapipe is unavailable.
          if ! vulkaninfo --summary >/dev/null 2>&1; then
            echo "::notice::no Vulkan device — skipping windowed examples"
            exit 0
          fi
          # 02_imgui drives the ui tier's ImGui overlay; 03_model drives the
          # profiler's per-pass GPU timestamps + debug labels (built-in cube, no
          # asset needed). All run with validation on, through the same
          # surface → swapchain → present path.
          xvfb-run -a build/examples/example_01_triangle --frames 30 2>&1 \
            | tee example.log
          xvfb-run -a build/examples/example_02_imgui --frames 30 2>&1 \
            | tee -a example.log
          xvfb-run -a build/examples/example_03_model --frames 30 2>&1 \
            | tee -a example.log
          if grep -qE 'VUID-' example.log; then
            echo "::error::Vulkan validation errors from the windowed examples"
            exit 1
          fi

  # Single matrix-independent status check for branch protection to require
  # (surfaces as "<os> / result"). It passes only if every leg of the build
  # matrix above passed, so the protected-branch required-checks list stays
  # stable when the build_type matrix changes — adding/renaming a leg otherwise
  # leaves the old required "<os> / build" context unreported and blocks every
  # PR indefinitely.
  result:
    needs: build
    # always() so a failed leg reports failure here rather than skipping this
    # job; a skipped required check never reports and would block merges forever.
    if: always()
    runs-on: ubuntu-24.04 # gate does no platform-specific work — cheap Linux runner
    steps:
      - name: Assert build matrix succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build matrix did not succeed (result: ${{ needs.build.result }})"
            exit 1
          fi
