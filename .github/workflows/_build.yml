name: build (reusable)

# Reusable build & test for one OS leg. ci.yml calls this once per entry in its
# build matrix. An Ubuntu leg runs on a self-hosted GPU box in a job container
# of its release's CI image with the GPU passed through (pass `runner` +
# `image`); a macOS leg runs on the runner itself (`image` ''), self-hosted
# (pass `runner`) or GitHub-hosted (pass just `os`), and checks or installs
# its Homebrew formulae.
on:
  workflow_call:
    inputs:
      os:
        description: Leg identity, used in the job name and cache key (e.g. ubuntu-24.04).
        required: true
        type: string
      runner:
        description: >-
          runs-on label. Empty → use `os` as a GitHub-hosted image; set to a
          self-hosted label (e.g. vk-linux-gpu) to move this leg onto your box.
        required: false
        type: string
        default: ''
      image:
        description: >-
          The job container's image, the CI image of the leg's Ubuntu release
          by digest, or '' to run on the runner itself (macOS).
        required: false
        type: string
        default: ''
      build_types:
        description: >-
          JSON array of the CMAKE_BUILD_TYPEs this leg builds and tests, one
          job each, e.g. '["Release"]'.
        required: false
        type: string
        default: '["Debug","Release"]'

# packages: the image is pulled from the core's GHCR package with the job's
# token; ci.yml grants it too.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.os }}
    # The image holds everything the Ubuntu legs build and test with (the
    # core's tools/ci/images). Its only Vulkan driver is the NVIDIA ICD the
    # container toolkit mounts (NVIDIA_DRIVER_CAPABILITIES=all), so the tests
    # run on the real GPU, and the GPU diagnostic below fails the leg without
    # it. An empty image runs the job on the runner itself: the macOS leg.
    # The token can be named only here, under `credentials`, so the container
    # is a mapping, not JSON from the caller.
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --gpus all
      # A runner's .env reaches jobs run directly on it (the Mac) but not a
      # job container, where ctest would otherwise run the suite one test at a
      # time, so the build and test fan-out is set here: 4 is a 24-core host
      # over gfx's 6 runners, the split the core's setup-runners.sh writes
      # into a runner's .env. NVIDIA's driver keeps compiled shaders only
      # under a directory that exists, which a container's HOME lacks; the
      # runner's tool cache (/__w/_tool) persists across jobs, so pipelines
      # compile warm (the core's tools/runners/README.md).
      env:
        NVIDIA_DRIVER_CAPABILITIES: all
        CMAKE_BUILD_PARALLEL_LEVEL: '4'
        CTEST_PARALLEL_LEVEL: '4'
        __GL_SHADER_DISK_CACHE_PATH: /__w/_tool/nvidia-glcache
        __GL_SHADER_DISK_CACHE_SKIP_CLEANUP: '1'
    timeout-minutes: 30
    defaults:
      run:
        # Inside a container GitHub runs `run:` steps under `sh` (dash), not the
        # `bash` it defaults to on hosted runners. Dash only learned `set -o
        # pipefail` in 0.5.12 (POSIX 2024) — Ubuntu 26.04 has it, 24.04 does
        # not — so force bash everywhere for one consistent shell across legs.
        shell: bash
    env:
      # 'true' when this leg runs in a container (the Ubuntu legs, with the
      # real GPU passed through); drives the GPU check below.
      IN_CONTAINER: ${{ inputs.image != '' }}
    strategy:
      fail-fast: false
      # One job per build type the caller asks for: ci.yml runs an optimized
      # Release/NDEBUG build on every OS, and an unoptimized Debug one on one OS,
      # so an NDEBUG-only or optimizer-exposed break is still caught.
      matrix:
        build_type: ${{ fromJSON(inputs.build_types) }}
    steps:
      # The shader cache directory the container env names is made here: the
      # driver creates nothing above its own GLCache, and the image cannot
      # hold it, as /__w is mounted at run time.
      - name: Shader cache directory
        if: inputs.image != ''
        run: mkdir -p "${__GL_SHADER_DISK_CACHE_PATH}"

      # Other repositories share the host; leave no token in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every build/test step below is gated on this, so a false here means the
      # job compiles nothing, runs no tests, and still reports success — which
      # `ci / required` would then treat as a passing build. There is no state
      # of this repo in which a missing top-level CMakeLists.txt is acceptable
      # (a rename, a moved workdir, or a path-filtered checkout would all
      # produce one), so fail loudly instead of annotating and skipping.
      - name: Detect build system
        id: detect
        run: |
          if [ ! -f CMakeLists.txt ]; then
            echo "::error::No top-level CMakeLists.txt in $(pwd) — refusing to report success for a job that would build and test nothing."
            ls -la
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      # The leg's formulae, named once: the Homebrew key below hashes their
      # versions. On the self-hosted Mac a job installs nothing and fails
      # naming any formula missing; a hosted runner installs what its image
      # lacks (volumetric_kit_core's tools/runners/README.md, "Upgrading
      # Homebrew").
      # TODO: take this check-or-install from a core action once the core has
      # one; recon and calib copy it too.
      - name: Install dependencies (macOS)
        id: formulae
        if: steps.detect.outputs.present == 'true' && runner.os == 'macOS'
        env:
          # The formulae we need are bottled, so skip the slow, network-heavy
          # auto-update — its `git fetch` is the step that flakes on transient
          # runner DNS ("Could not resolve host: github.com").
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          # spirv-tools provides spirv-val: vkc_compile_shaders runs it only
          # when present, so without it this leg compiles SPIR-V it never
          # validates and the check exists on Linux alone.
          pkgs="cmake molten-vk glfw glm vulkan-headers vulkan-loader"
          pkgs="$pkgs vulkan-tools shaderc spirv-cross spirv-tools"
          pkgs="$pkgs vulkan-validationlayers"
          echo "formulae=$pkgs" >> "$GITHUB_OUTPUT"
          missing=""
          for pkg in $pkgs; do
            brew list --formula "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
          done
          if [ -n "$missing" ] && [ "${{ runner.environment }}" = self-hosted ]; then
            echo "::error::install by hand on this self-hosted runner's host, while CI is idle:${missing}"
            exit 1
          fi
          if [ -n "$missing" ]; then
            # Retry to ride out transient Homebrew fetch/DNS blips.
            ok=0
            for attempt in 1 2 3; do
              # shellcheck disable=SC2086  # intentional: split $missing
              if brew install $missing; then
                ok=1
                break
              fi
              echo "::warning::brew install attempt ${attempt} failed; retrying in 15s"
              sleep 15
            done
            [ "${ok}" = 1 ] || {
              echo "::error::brew install failed after 3 attempts"
              exit 1
            }
          fi
          # The layer's manifest names its library without a path; the Test
          # step alone searches Homebrew's lib for it, as job-wide its
          # libraries would shadow those of every later tool.
          echo "VKC_LAYER_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$(brew --prefix)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          # make ships with the Xcode command-line tools.

      # Report the Vulkan device the runner sees (the real GPU in the
      # container, MoltenVK on macOS). On macOS a missing device is a notice.
      # In a container it fails the leg: that leg exists only for the GPU
      # behind `--gpus all`, and a green build there with every GPU test
      # skipped is exactly the failure that went unnoticed for a month.
      - name: GPU diagnostic
        if: steps.detect.outputs.present == 'true'
        run: |
          if vulkaninfo --summary; then
            exit 0
          fi
          if [ "$IN_CONTAINER" = "true" ]; then
            echo "::error::no Vulkan device visible inside the GPU container — refusing to pass a leg that would skip every GPU test"
            exit 1
          fi
          echo "::notice::no Vulkan device visible — GPU tests will skip"

      # The dependency cache is keyed by the workspace *path*, so compute a short
      # fingerprint of it. See the cache step below for why the path is the thing
      # that has to match.
      - name: Workspace fingerprint
        id: ws
        if: steps.detect.outputs.present == 'true'
        run: |
          h=$(printf '%s' "${GITHUB_WORKSPACE}" |
              { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-12)
          echo "hash=${h}" >> "${GITHUB_OUTPUT}"
          echo "workspace ${GITHUB_WORKSPACE} -> ${h}"

      # The installed versions of the leg's formulae and of all they depend
      # on, hashed, for the deps cache key below. The action runs at gfx's core
      # pin (CMakeLists.txt), which a pre-commit hook holds it to.
      - name: Homebrew key
        id: brew
        if: steps.detect.outputs.present == 'true' && runner.os == 'macOS'
        uses: taojin-6/volumetric_kit_core/.github/actions/homebrew-key@c52a86ab8fcfd11fb6afbfeaf0ae9ef2209b18b2
        with:
          formulae: ${{ steps.formulae.outputs.formulae }}

      # Cache the FetchContent dependency tree (VMA / spirv-cross / googletest
      # sources + builds) so they are not re-cloned and recompiled every run.
      # FetchContent bakes the absolute build path into its sub-build CMakeCache,
      # so a cache is only reusable where that path is identical -- restore one
      # built elsewhere and Configure dies with "CMakeCache.txt directory ... is
      # different than the directory ... where CMakeCache.txt was created".
      #
      # The key therefore carries a hash of GITHUB_WORKSPACE: the path itself,
      # not a proxy for it. This previously keyed on `runner.name` for native
      # runners, on the assumption that a given runner's path is stable -- but
      # relocating a self-hosted runner on disk (…/actions-runner-N ->
      # …/ci-runners/<repo>/runner-N) changes the path while keeping the name, so
      # the key still matched and every macOS leg restored a cache full of dead
      # absolute paths and failed to configure. Hashing the workspace makes a
      # relocation a natural cache miss instead. It also subsumes the `ctr`
      # special case: containerised legs all see the same /__w/… path, so they
      # hash alike and share one key exactly as before.
      #
      # The key also hashes the files holding the pins, third_party/CMakeLists.txt
      # and CMakeLists.txt (the core's), and carries the Homebrew key ("none"
      # on Linux), so the first macOS run after a brew upgrade misses once and
      # rebuilds on the new versions.
      - name: Cache third-party deps
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-${{ inputs.os }}-${{ matrix.build_type }}-brew${{ steps.brew.outputs.key || 'none' }}-ws${{ steps.ws.outputs.hash }}-${{ hashFiles('third_party/CMakeLists.txt', 'CMakeLists.txt') }}
          # No restore-keys: a prefix fallback drops the pins' hash, so flipping
          # a dependency's version or build options would restore and relink
          # the archives built from the *previous* pin — a stale-object failure
          # that looks like a source bug. A pin change should be a clean cache
          # miss (a full dependency rebuild) rather than a silent reuse.

      # A self-hosted runner keeps its _work tree between jobs, so a build/ left
      # by a previous checkout survives a runner relocation with the old absolute
      # paths still baked into every CMakeCache.txt. The key change above stops
      # the *cache* carrying stale paths in, but cannot clean what is already on
      # disk -- and the Configure retry loop cannot help either, since the failure
      # is deterministic and simply fails three times.
      #
      # So: if any CMakeCache.txt under build/ records a directory other than the
      # one it now occupies, the tree is unusable. Drop it and let Configure start
      # clean. Hosted runners always start empty and no-op here.
      - name: Discard a build tree left behind at a different path
        if: steps.detect.outputs.present == 'true'
        run: |
          [ -d build ] || exit 0
          stale=$(find build -name CMakeCache.txt -exec sh -c '
            recorded=$(sed -n "s/^CMAKE_CACHEFILE_DIR:INTERNAL=//p" "$1" | head -1)
            actual=$(cd "$(dirname "$1")" && pwd)
            if [ -n "${recorded}" ] && [ "${recorded}" != "${actual}" ]; then
              echo "$1 records ${recorded}, now at ${actual}"
            fi
          ' _ {} \; | head -3)
          if [ -n "${stale}" ]; then
            echo "::warning::discarding a stale build tree:"
            echo "${stale}"
            rm -rf build
          fi

      # Default ("Unix Makefiles") generator + a parallel make build, per
      # project preference — no Ninja.
      - name: Configure
        if: steps.detect.outputs.present == 'true'
        # Retry to ride out transient FetchContent git-clone DNS blips, matching
        # the package-install retry above.
        run: |
          ok=0
          for attempt in 1 2 3; do
            # VG_TEST_SHARDS: run each test binary as 4 one-process shards, so
            # its tests share Vulkan devices (tests/CMakeLists.txt).
            if cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DVG_TEST_SHARDS=4; then
              ok=1
              break
            fi
            echo "::warning::cmake configure attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          [ "${ok}" = 1 ] || {
            echo "::error::cmake configure failed after 3 attempts"
            exit 1
          }

      # Builds CMAKE_BUILD_PARALLEL_LEVEL jobs at once (set alongside the Test
      # step's CTEST_PARALLEL_LEVEL), or one per CPU without it. Passed
      # explicitly: a bare --parallel runs an unlimited `make -j` and ignores
      # the variable.
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"

      # Runs CTEST_PARALLEL_LEVEL shards at once: from the runner's .env on the
      # Mac, from the container env ci.yml sets on the Ubuntu legs.
      - name: Test
        if: steps.detect.outputs.present == 'true'
        env:
          # Each shard runs its tests in a random order (the seed is printed),
          # so a test that passes only after another one fails here instead.
          GTEST_SHUFFLE: '1'
          # The core's test policy (its README, "Build and test"). Every leg
          # has a Vulkan device -- the GPU box's (the GPU diagnostic step
          # insists) or MoltenVK -- so a fixture test that cannot get one is a
          # failure, not a skip: a shard would otherwise pass with all of its
          # tests skipped. Every test runs under the validation layer, and
          # fails on an error it reports or without it.
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          VKC_TEST_VALIDATION: '1'
        # Set on the command, as macOS strips DYLD_* from a step's env when it
        # starts the system's bash. A test that hangs fails after a minute
        # rather than holding the runner until the job's time limit; the
        # slowest shard takes a few seconds. The consumer configure (label
        # consumer) checks CMake, not a device, so one leg runs it.
        run: |
          DYLD_LIBRARY_PATH="${VKC_LAYER_LIBRARY_PATH:-}" \
            ctest --test-dir build --output-on-failure --timeout 60 \
              ${{ inputs.os != 'ubuntu-26.04' && '-LE consumer' || '' }}

      # A shard passes with its skipped tests unreported. On Apple a skip fails
      # its shard; on Linux, where NVIDIA's driver lacks capabilities some tests
      # probe, the step summary lists them (tests/CMakeLists.txt).
      - name: List skipped tests (Linux)
        if: steps.detect.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          skipped=$(grep -h '^\[  SKIPPED \] .* ms)$' \
            build/Testing/Temporary/LastTest.log | sort || true)
          {
            echo "### Skipped tests: $(grep -c . <<<"$skipped")"
            echo '```'
            echo "$skipped"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the configured headless example
        if: steps.detect.outputs.present == 'true'
        run: |
          DYLD_LIBRARY_PATH="${VKC_LAYER_LIBRARY_PATH:-}" \
            cmake -DEXAMPLE_EXE="$PWD/build/examples/example_03_model" \
              -DSCREENSHOT_CONFIG="$PWD/build/examples/config/model-screenshot.json" \
              -DEXPECTED_SCREENSHOT="$PWD/build/examples/config/model.ppm" \
              -DWORK_DIR="$PWD/build/screenshot-working-directory" \
              -P tests/example_screenshot.cmake

      # gfx must stay generatable with -G Xcode -- that is the generator an iOS
      # or macOS app bundle consumes. What regresses on macOS is the *generate*,
      # not the build (e.g. a custom command reachable from two targets with no
      # edge between them, which Xcode rejects outright), so generating is the
      # macOS check. The Makefile legs above cannot see it. The libraries are
      # then built for iOS, which only a build checks: a compile that breaks on
      # iOS alone, or a find that runs before the core's iOS module. Xcode is
      # multi-config, so one generate covers both build types -- run it on the
      # Debug leg only.
      - name: Xcode generate check and iOS build (macOS)
        if: >-
          steps.detect.outputs.present == 'true' && runner.os == 'macOS'
          && matrix.build_type == 'Debug'
        run: |
          shopt -s nullglob

          # -G Xcode drives xcodebuild, which ships with full Xcode only -- the
          # command line tools do not include it. Resolve a developer directory
          # that has one: prefer whatever is active, but fall back to a
          # discovered Xcode.app, since xcode-select can point at the command
          # line tools on a machine that does have Xcode and re-pointing it is
          # global and needs sudo. DEVELOPER_DIR is per-process, so this needs
          # no privileges and changes nothing outside the step -- and dropping
          # the inherited value first keeps the result independent of what the
          # runner's launchd session happened to export.
          unset DEVELOPER_DIR
          DEVELOPER_DIR=$(xcode-select -p 2>/dev/null) || DEVELOPER_DIR=
          if [ ! -x "${DEVELOPER_DIR}/usr/bin/xcodebuild" ]; then
            for app in /Applications/Xcode*.app; do
              if [ -x "${app}/Contents/Developer/usr/bin/xcodebuild" ]; then
                DEVELOPER_DIR="${app}/Contents/Developer"
                break
              fi
            done
          fi
          export DEVELOPER_DIR

          # Probe xcodebuild rather than trusting the path: a missing Xcode, an
          # unaccepted license and a pending first launch all fail here, and all
          # three otherwise reach CMake as nothing more than "The CXX compiler
          # identification is unknown".
          if ! probe=$(xcodebuild -version 2>&1); then
            echo "::error::-G Xcode needs a working full Xcode. Developer directory resolved to '${DEVELOPER_DIR:-none}'; xcodebuild said: ${probe}"
            echo "On the runner: install Xcode, then sudo xcodebuild -license accept && sudo xcodebuild -runFirstLaunch"
            exit 1
          fi
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          echo "${probe}"

          # Reuse the sources FetchContent already populated for `build`, so
          # this costs one configure rather than a re-clone. Derived from the
          # directory names instead of a hardcoded dep list, so adding a
          # third_party dep needs no edit here; if the deps are missing the
          # array is empty and FetchContent just fetches. A separate -B dir
          # keeps `build/` -- and the deps cache uploaded from it -- untouched.
          flags=()
          for src in build/_deps/*-src; do
            dep=$(basename "${src}" -src | tr '[:lower:]' '[:upper:]')
            flags+=("-DFETCHCONTENT_SOURCE_DIR_${dep}=${PWD}/${src}")
          done
          rm -rf build-xcode
          cmake -S . -B build-xcode -G Xcode "${flags[@]}"

          # The libraries for iPhone and iPad, against MoltenVK's iOS release:
          # the core's cmake/vkc_ios.cmake reads MoltenVK_ROOT, which the
          # runner's .env sets (the core's tools/runners/README.md, "Macs").
          if [ -z "${MoltenVK_ROOT:-}" ]; then
            echo "::error::MoltenVK_ROOT is not set: the iOS build needs MoltenVK's iOS release, named in this runner's .env by the core's setup-runners.sh"
            exit 1
          fi
          rm -rf build-ios
          cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            -DVG_BUILD_TESTS=OFF -DVG_BUILD_EXAMPLES=OFF -DVG_WITH_GLFW=OFF \
            "${flags[@]}"
          cmake --build build-ios --config Debug \
            --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}" \
            -- CODE_SIGNING_ALLOWED=NO

      # Runtime-validate the windowing tier through the real window -> surface ->
      # swapchain -> present path, which the headless-surface tests do not
      # reach: drive the windowed example through the X11 WSI on a virtual X
      # server with validation layers on.
      # macOS runners are display-less, so the example is build-only there (it is
      # runtime-validated locally on MoltenVK). On the self-hosted GPU box this
      # runs against the real 5090, still under Xvfb since the example opens a
      # GLFW/X11 window. NVIDIA's ICD offers no VK_EXT_headless_surface, so this
      # is the box's only present path.
      - name: Run windowed examples (Linux, Xvfb)
        if: steps.detect.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          set -o pipefail
          # Skip (don't fail) when no Vulkan device is present, matching how the
          # GPU-dependent ctest cases skip themselves — e.g. a runner where
          # lavapipe is unavailable.
          if ! vulkaninfo --summary >/dev/null 2>&1; then
            echo "::notice::no Vulkan device — skipping windowed examples"
            exit 0
          fi
          # 02_imgui drives the ui tier's ImGui overlay; 03_model drives the
          # profiler's per-pass GPU timestamps + debug labels (built-in cube, no
          # asset needed); 04_image converts and mip-maps a picture every frame
          # through ImagePipeline. All run with validation on, through the same
          # surface → swapchain → present path.
          xvfb-run -a build/examples/example_01_triangle --config examples/config/smoke.json 2>&1 \
            | tee example.log
          xvfb-run -a build/examples/example_02_imgui --config examples/config/smoke.json 2>&1 \
            | tee -a example.log
          xvfb-run -a build/examples/example_03_model --config examples/config/smoke.json 2>&1 \
            | tee -a example.log
          xvfb-run -a build/examples/example_04_image --config examples/config/smoke.json 2>&1 \
            | tee -a example.log
          for example in 01_triangle 02_imgui 03_model 04_image; do
            if ! grep -qF "$example: rendered 30 frame(s)" example.log; then
              echo "::error::$example did not honor run.frames"
              exit 1
            fi
          done
          if grep -qE 'VUID-' example.log; then
            echo "::error::Vulkan validation errors from the windowed examples"
            exit 1
          fi
