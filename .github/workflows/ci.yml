name: CI

# Two-stage pipeline: a styling/docs gate (pre-commit) runs first, and the
# build & test matrix only runs if it passes (build: needs: lint) — so the
# heavier build runners never start on a formatting failure.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Styling + docs gate. Runs the same hooks as the local `pre-commit` install.
  # Linux-only: clang-format and cmake-format output is deterministic across
  # operating systems, so one runner is enough.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Cache pre-commit's installed hook environments (incl. the pinned
      # clang-format) keyed on the config so they're only rebuilt when it changes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  # Real CI: build + test on the target platforms. Runs only if `lint` passed.
  build:
    needs: lint
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # GitHub currently ships Ubuntu 22.04 and 24.04 runner images only.
        # (26.04 has no hosted runner yet.)
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Detect build system
        id: detect
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CMakeLists.txt yet — skipping build/test (scaffolding stage)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies (Linux)
        if: steps.detect.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libvulkan-dev vulkan-validationlayers spirv-tools glslang-tools \
            libglfw3-dev libglm-dev
          # make + a C/C++ toolchain ship preinstalled (build-essential).

      - name: Install dependencies (macOS)
        if: steps.detect.outputs.present == 'true' && runner.os == 'macOS'
        run: |
          brew update
          brew install cmake molten-vk glfw glm \
            vulkan-headers vulkan-loader vulkan-tools shaderc spirv-cross
          # make ships with the Xcode command-line tools.

      # Default ("Unix Makefiles") generator + a parallel make build, per
      # project preference — no Ninja.
      - name: Configure
        if: steps.detect.outputs.present == 'true'
        run: cmake -S . -B build

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: cmake --build build --parallel

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: ctest --test-dir build --output-on-failure
