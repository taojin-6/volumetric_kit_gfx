name: ci

# Umbrella CI. Every platform build/test plus lint and sanitizers fan out from
# here, and the single `required` gate at the bottom succeeds only if all of
# them did. Branch protection requires just that one check ("ci / required"), so
# the protected `main` required-checks list stays stable as matrix legs (build
# types, OSes) are added or renamed — adding an OS never silently leaves an old
# required context unreported and blocking every PR.
#
# Only the owner triggers this repository's workflows, so no job carries a fork
# guard (CONTRIBUTING.md, "Who can trigger CI").
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    # The Ubuntu legs pull their image from the core's GHCR package.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      # The two Ubuntu legs run on the self-hosted GPU box (label
      # `vk-linux-gpu`), each in a job container of the family's CI image for
      # its release (the core's tools/ci/images) with the GPU passed through
      # (`--gpus all`), so one host covers 24.04 / 26.04 against the real
      # driver. Run one runner instance per leg on that box so they execute in
      # parallel, not serially (CONTRIBUTING.md, "Self-hosted runners").
      # macOS runs natively on a self-hosted Mac (label `mac`) — macOS can't be
      # containerised — so its `image` is ''.
      # Release runs on every OS; Debug only on macOS, where it is cheap. Every
      # Ubuntu Debug leg added another full suite's worth of GPU device creation
      # to boxes that can only do so many at a time, and sanitizers already
      # builds and tests Debug on Linux (clang + ASan/UBSan).
      # Each image is pinned by digest, the tag it was read from in a comment,
      # so a new image comes only with a commit that moves the pin.
      matrix:
        include:
          - os: ubuntu-24.04
            runner: vk-linux-gpu
            # ghcr.io/taojin-6/volumetric_kit_ci:ubuntu-24.04
            image: ghcr.io/taojin-6/volumetric_kit_ci@sha256:14e18e23ec99fc77cb671722ec9d0f5774e124951c047f67731740441234fd6b
            build_types: '["Release"]'
          - os: ubuntu-26.04
            runner: vk-linux-gpu
            # ghcr.io/taojin-6/volumetric_kit_ci:ubuntu-26.04
            image: ghcr.io/taojin-6/volumetric_kit_ci@sha256:b39be8613b4e8140a45c98cfc23bb1f40f98300d213fdab901c3108f02df626e
            build_types: '["Release"]'
          - os: macos-26
            runner: mac
            image: ''
            build_types: '["Debug","Release"]'
    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      image: ${{ matrix.image }}
      build_types: ${{ matrix.build_types }}

  lint:
    uses: ./.github/workflows/lint.yml

  sanitizers:
    uses: ./.github/workflows/sanitizers.yml

  required:
    # The single status check branch protection requires. It passes only when
    # every build leg, lint, and sanitizers succeeded, and FAILS (never skips)
    # on any other outcome: a skipped required check never reports its result
    # and would block every merge forever. Runs on a hosted runner so the gate
    # can always report, even while a platform is mid-migration to self-hosted.
    needs: [build, lint, sanitizers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        run: |
          echo "build=${{ needs.build.result }}" \
               "lint=${{ needs.lint.result }}" \
               "sanitizers=${{ needs.sanitizers.result }}"
          if [ "${{ needs.build.result }}" = success ] \
             && [ "${{ needs.lint.result }}" = success ] \
             && [ "${{ needs.sanitizers.result }}" = success ]; then
            echo "All required CI jobs passed."
          else
            echo "::error::one or more required CI jobs did not succeed (see results above)"
            exit 1
          fi
