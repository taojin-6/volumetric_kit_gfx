name: ci

# Umbrella CI. Every platform build/test plus lint and sanitizers fan out from
# here, and the single `required` gate at the bottom succeeds only if all of
# them did. Branch protection requires just that one check ("ci / required"), so
# the protected `main` required-checks list stays stable as matrix legs (build
# types, OSes) are added or renamed — adding an OS never silently leaves an old
# required context unreported and blocking every PR.
#
# Only the owner triggers this repository's workflows, so no job carries a fork
# guard (CONTRIBUTING.md, "Who can trigger CI").
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The three Ubuntu legs run on the self-hosted GPU box (label
      # `vk-linux-gpu`), each in an OS-matched container with the RTX 5090 passed
      # through (`--gpus all`), so one host covers 22.04 / 24.04 / 26.04 against
      # the real driver. Run one runner instance per leg on that box so they
      # execute in parallel, not serially (CONTRIBUTING.md, "Self-hosted
      # runners").
      # macOS runs natively on a self-hosted Mac (label `mac`) — no container,
      # since macOS can't be containerised. _build.yml keys its install steps off
      # `runner.os`, so the macOS leg's Homebrew/MoltenVK path is unchanged and
      # only the Ubuntu legs use a container image; NVIDIA_DRIVER_CAPABILITIES=all
      # makes the toolkit mount the Vulkan ICD + graphics libs for those.
      # The build and test fan-out is set in the container env, too: a runner's
      # .env reaches jobs run directly on it (the Mac) but not a job container,
      # where ctest would otherwise run the suite one test at a time.
      # TODO: 4 shares a box's cores among gfx's 6 runners only; match the
      # .env core's setup-runners.sh writes, which counts recon's runners too.
      # Release runs on every OS; Debug only on macOS, where it is cheap. Every
      # Ubuntu Debug leg added another full suite's worth of GPU device creation
      # to boxes that can only do so many at a time, and sanitizers already
      # builds and tests Debug on Linux (clang + ASan/UBSan).
      matrix:
        include:
          - os: ubuntu-22.04
            runner: vk-linux-gpu
            container: '{"image":"ubuntu:22.04","options":"--gpus all","env":{"NVIDIA_DRIVER_CAPABILITIES":"all","CMAKE_BUILD_PARALLEL_LEVEL":"4","CTEST_PARALLEL_LEVEL":"4"}}'
            build_types: '["Release"]'
          - os: ubuntu-24.04
            runner: vk-linux-gpu
            container: '{"image":"ubuntu:24.04","options":"--gpus all","env":{"NVIDIA_DRIVER_CAPABILITIES":"all","CMAKE_BUILD_PARALLEL_LEVEL":"4","CTEST_PARALLEL_LEVEL":"4"}}'
            build_types: '["Release"]'
          - os: ubuntu-26.04
            runner: vk-linux-gpu
            container: '{"image":"ubuntu:26.04","options":"--gpus all","env":{"NVIDIA_DRIVER_CAPABILITIES":"all","CMAKE_BUILD_PARALLEL_LEVEL":"4","CTEST_PARALLEL_LEVEL":"4"}}'
            build_types: '["Release"]'
          - os: macos-26
            runner: mac
            container: ''
            build_types: '["Debug","Release"]'
    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      container: ${{ matrix.container }}
      build_types: ${{ matrix.build_types }}

  lint:
    uses: ./.github/workflows/lint.yml

  sanitizers:
    uses: ./.github/workflows/sanitizers.yml

  required:
    # The single status check branch protection requires. It passes only when
    # every build leg, lint, and sanitizers succeeded, and FAILS (never skips)
    # on any other outcome: a skipped required check never reports its result
    # and would block every merge forever. Runs on a hosted runner so the gate
    # can always report, even while a platform is mid-migration to self-hosted.
    needs: [build, lint, sanitizers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        run: |
          echo "build=${{ needs.build.result }}" \
               "lint=${{ needs.lint.result }}" \
               "sanitizers=${{ needs.sanitizers.result }}"
          if [ "${{ needs.build.result }}" = success ] \
             && [ "${{ needs.lint.result }}" = success ] \
             && [ "${{ needs.sanitizers.result }}" = success ]; then
            echo "All required CI jobs passed."
          else
            echo "::error::one or more required CI jobs did not succeed (see results above)"
            exit 1
          fi
